baseURL = "https://mostafaghadimi.github.io/blog/"
theme = "PaperMod"
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
paginate = 10

defaultContentLanguage = "fa"
defaultContentLanguageInSubdir = false

[minify]
  disableXML = true
  minifyOutput = true

# Enable JSON index for search
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ---- shared params (same for every language) ----
[params]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  ShowAllPagesInArchive = true
  ShowPageNums = true
  comments = false

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/mostafaghadimi"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/mostafaghadimi"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github-dark"

# ---- languages ----
[languages]
  [languages.fa]
    label = "فارسی"
    locale = "fa-IR"
    direction = "rtl"
    weight = 1
    title = "مصطفی قدیمی — وبلاگ"
    [languages.fa.params]
      author = "مصطفی قدیمی"
      description = "درباره‌ی مهندسی داده، هوش مصنوعی، پایتون و سیستم‌های توزیع‌شده می‌نویسم."
      [languages.fa.params.homeInfoParams]
        Title = "سلام، من مصطفی‌ام 👋"
        Content = "مهندس داده و سازنده‌ی عامل‌های هوش مصنوعی. درباره‌ی پایپ‌لاین‌های استریمینگ، عامل‌های LangGraph، پایتون و سیستم‌های توزیع‌شده می‌نویسم — چیزهایی که عملاً روشون کار می‌کنم."
    [languages.fa.menu]
      [[languages.fa.menu.main]]
        identifier = "tags"
        name = "برچسب‌ها"
        url = "/tags/"
        weight = 10
      [[languages.fa.menu.main]]
        identifier = "archives"
        name = "آرشیو"
        url = "/archives/"
        weight = 20
      [[languages.fa.menu.main]]
        identifier = "search"
        name = "جستجو"
        url = "/search/"
        weight = 30

  [languages.en]
    label = "English"
    locale = "en-US"
    direction = "ltr"
    weight = 2
    title = "Mostafa Ghadimi — Blog"
    [languages.en.params]
      author = "Mostafa Ghadimi"
      description = "I write about data engineering, AI, Python, and distributed systems."
      [languages.en.params.homeInfoParams]
        Title = "Hi, I'm Mostafa 👋"
        Content = "Data engineer and builder of AI agents. I write about streaming pipelines, LangGraph agents, Python, and distributed systems — the things I actually work on."
    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "tags"
        name = "Tags"
        url = "/tags/"
        weight = 10
      [[languages.en.menu.main]]
        identifier = "archives"
        name = "Archive"
        url = "/archives/"
        weight = 20
      [[languages.en.menu.main]]
        identifier = "search"
        name = "Search"
        url = "/search/"
        weight = 30
